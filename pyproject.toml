[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-music-glmy"
version = "0.3.0"
description = "Directed persistent path homology for musical state sequences and audio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research-only scaffold; data licenses are tracked separately" }
authors = [{ name = "Focus Music GLMY research team" }]
keywords = ["music information retrieval", "topological data analysis", "path homology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<3",
  "pyglmy>=0.1.0,<0.2",
]

[project.optional-dependencies]
audio = [
  "imageio-ffmpeg>=0.6",
  "librosa>=0.10.2",
  "mutagen>=1.47",
  "pyloudnorm>=0.1.1",
  "soundfile>=0.12.1",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyarrow>=15",
]
stats = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "seaborn>=0.13",
]
tda = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "ripser>=0.6.12",
  "scikit-learn>=1.4",
  "scipy>=1.12",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
focus-topology = "focus_topology.cli:main"
focus-controls = "data.controls:main"
focus-catalog = "data.focus:main"
focus-open = "data.focus_open:main"
focus-preprocess = "data.preprocess:main"
focus-features = "features.batch:main"
focus-path-analysis = "topology.batch:main"
focus-tda = "tda.analysis:main"
focus-repetition = "repetition.analysis:main"
focus-repetition-strengthened = "repetition.strengthened:main"
focus-multiscale-delay = "repetition.multiscale_delay:main"
focus-ace-rerank = "generation.rerank_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
focus_topology = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["packages/pyglmy/src", "src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
