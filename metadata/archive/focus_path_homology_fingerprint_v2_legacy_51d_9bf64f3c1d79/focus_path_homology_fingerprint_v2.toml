[fingerprint]
fingerprint_id = "focus_path_homology_fingerprint_v2"
reference_scale_seconds = 180.0
reference_split = "discovery"
positive_group = "focus"
negative_group = "classical"
random_seed = 20260716

[blocks]
local_views = ["pitch", "rhythm", "modulation"]
phase_views = ["path_acoustic_phase", "path_chroma_phase"]
auxiliary_views = ["structure"]
local_view_weight = 0.3333333333333333
phase_view_weight = 0.5
lp_local_weight = 0.5
lp_phase_weight = 0.5

[classifier]
kind = "l2_logistic_regression"
c = 10.0
class_weight = "balanced"
max_iter = 5000
decision_threshold = 0.5
focus_target_logit_quantile = 0.10

[evidence]
primary = "validation/180s"
duration_sensitivity = "validation/300s"
holdout = "opened descriptive compatibility check only"
status = "exploratory_validated_path_homology_fingerprint"

[exclusions]
tda_features = true
structure_from_primary = true
rhythm_phase_from_primary = true
h1_h2_targets = true
